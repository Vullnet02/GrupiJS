<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Validation Popup</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
    }

    .container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.3);
    }

    h2{
      margin-bottom:20px;
      color:#0f172a;
    }

    input{
      width:100%;
      padding:14px;
      border:2px solid #cbd5e1;
      border-radius:12px;
      outline:none;
      font-size:16px;
      margin-bottom:15px;
      transition:0.3s;
    }

    input:focus{
      border-color:#3b82f6;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#3b82f6;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#2563eb;
    }

    .popup{
      position:fixed;
      top:20px;
      right:20px;
      padding:18px 25px;
      border-radius:12px;
      color:white;
      font-weight:bold;
      transform:translateX(400px);
      transition:0.4s;
    }

    .popup.show{
      transform:translateX(0);
    }

    .success{
      background:#22c55e;
    }

    .error{
      background:#ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Kontrollo Email</h2>

    <input 
      type="text" 
      id="email"
      placeholder="Shkruaj email..."
    >

    <button onclick="checkEmail()">
      Verifiko
    </button>
  </div>

  <div class="popup" id="popup"></div>

  <script>
    const popup = document.getElementById("popup");

    function showPopup(message, type){
      popup.innerText = message;

      popup.className = "popup show " + type;

      setTimeout(() => {
        popup.classList.remove("show");
      }, 3000);
    }

    function checkEmail(){
      const email = document.getElementById("email").value;

      if(email.includes("@")){
        showPopup("Email eshte valid ✅", "success");
      }else{
        showPopup("Email nuk eshte valid ❌", "error");
      }
    }
  </script>

</body>
</html>
